version: '3.8'

services:
  api:
    build: ./backend
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/data
    env_file: ./backend/.env
    environment:
      - DATA_DIR=/data
    depends_on:
      - redis

  worker:
    build: ./backend
    command: celery -A src.worker.celery_app worker --loglevel=info --concurrency=1
    volumes:
      - ./backend/data:/data
    env_file: ./backend/.env
    environment:
      - DATA_DIR=/data
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

volumes:
  redis-data:
