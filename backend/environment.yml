name: copernicus-env
channels:
  - conda-forge
  - defaults

dependencies:
  - python=3.11
  - pip

  # Core scientific stack (conda-managed for native library linkage)
  - numpy=1.26
  - pandas=2.2
  - xarray=2024.3
  - netCDF4=1.6
  - dask=2024.4
  - scipy=1.13
  - matplotlib=3.8
  - pyproj=3.6
  - h5py=3.11
  - zarr=2.17
  - fsspec=2024.3
  - cftime=1.6

  # Notebooks
  - jupyter
  - jupyterlab
  - ipykernel

  # Config
  - python-dotenv=1.0
  - pyyaml=6.0
  - click=8.1

  # pip-managed packages (not on conda-forge or need latest)
  - pip:
    - copernicusmarine==1.3.2
    # Parcels v3 — compatible with plasticparcels 0.4.0
    # See requirements.txt for version compatibility notes.
    - parcels==3.0.5
    - plasticparcels==0.4.0
